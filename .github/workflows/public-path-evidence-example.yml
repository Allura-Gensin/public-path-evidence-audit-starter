name: Public-path evidence example

on:
  workflow_dispatch:
    inputs:
      urls-json:
        description: JSON array of one to five credential-free public HTTPS URLs
        required: true
        default: '["https://example.com/"]'
        type: string

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture bounded public-path evidence
        id: evidence
        # Pinned to the exact independently reviewed implementation commit.
        uses: Allura-Gensin/public-path-evidence-audit-starter@af85ce58fa071c56e4d16d19b77c19a2a69dbd9e
        with:
          urls-json: ${{ inputs.urls-json }}

      - name: Report fixed aggregate status
        shell: bash
        env:
          ROUTE_COUNT: ${{ steps.evidence.outputs.route-count }}
          HTML_COUNT: ${{ steps.evidence.outputs.html-count }}
        run: printf 'Captured %s route(s); %s bounded HTML summary(s).\n' "$ROUTE_COUNT" "$HTML_COUNT"
